appId: org.reactjs.native.example.MeheryExample
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Open chat"
    timeout: 20000
- tapOn:
    id: "mehery-launcher"
- extendedWaitUntil:
    visible: "Track my order"
    timeout: 15000
# 1. Swiping the messages must NOT close the chat.
- swipe:
    start: "50%, 40%"
    end: "50%, 80%"
    duration: 400
- waitForAnimationToEnd
- assertVisible:
    id: "mehery-input"
- takeScreenshot: 01-after-message-swipe
# 2. Photo viewer: open, swipe down, gone.
- tapOn: "Track my order"
- extendedWaitUntil:
    visible: ".*email address on the order.*"
    timeout: 15000
- tapOn:
    id: "mehery-input"
- inputText: "sam@acme.com"
- tapOn:
    id: "mehery-send"
- extendedWaitUntil:
    visible:
      id: "mehery-image"
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: "mehery-image"
- extendedWaitUntil:
    visible:
      id: "mehery-viewer-close"
    timeout: 5000
- takeScreenshot: 02-viewer-open
- swipe:
    start: "50%, 45%"
    end: "50%, 85%"
    duration: 300
- waitForAnimationToEnd
- assertNotVisible:
    id: "mehery-viewer-close"
- assertVisible:
    id: "mehery-input"
- takeScreenshot: 03-viewer-dismissed
# 3. Swiping the header closes the chat into the launcher.
- swipe:
    start: "40%, 11%"
    end: "40%, 55%"
    duration: 350
- waitForAnimationToEnd
- assertNotVisible:
    id: "mehery-input"
- assertVisible:
    id: "mehery-launcher"
- takeScreenshot: 04-header-swipe-closed
